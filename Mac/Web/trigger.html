<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>扳机</title>
<style>
  :root { --font:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; --red:#ff4033; --blue:#3b82f6; --orange:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; touch-action:none; }
  #flash { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .25s ease-out;
    background:radial-gradient(circle at center, rgba(255,40,30,.45), transparent 70%); }
  #flash.on { opacity:1; transition:none; }
  #app { position:relative; height:100%; display:flex; flex-direction:column; gap:16px;
    padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 14px); }
  header { display:flex; align-items:center; gap:10px; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--orange); flex:none; }
  #dot.ok { background:#22c55e; }
  #status { font-size:13px; color:#999; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #kills { color:var(--red); font-weight:700; }
  #ammo { font:900 28px ui-monospace,Menlo,monospace; }
  #ammo.empty { color:var(--red); }
  .seg { display:flex; background:#1c1c1e; border-radius:9px; padding:2px; }
  .seg button { flex:1; border:0; background:transparent; color:#fff; font:600 15px var(--font); padding:7px 0; border-radius:7px; }
  .seg button.sel { background:#636366; }
  #result { height:30px; text-align:center; font-size:20px; font-weight:900; }
  #result.kill { color:var(--red); } #result.head { color:#ffd64d; }
  #marker { flex:1; display:flex; align-items:center; justify-content:center; min-height:60px; }
  #marker svg { width:120px; height:120px; opacity:0; transform:scale(1.4); transition:opacity .3s ease-out, transform .3s ease-out; }
  #marker svg.on { opacity:1; transform:scale(1); transition:opacity .05s, transform .05s; }
  .row { display:flex; gap:14px; }
  .btn { flex:1; border-radius:14px; min-height:54px; font:700 17px var(--font); color:#fff; background:transparent; }
  .btn.small { min-height:38px; border-radius:10px; font-size:15px; border:0; background:rgba(255,255,255,.08); color:rgba(255,255,255,.85); }
  .btn.blue { border:1.5px solid var(--blue); background:rgba(59,130,246,.25); }
  .btn.orange { border:1.5px solid var(--orange); background:rgba(245,158,11,.25); }
  .btn:active { filter:brightness(1.4); }
  #trigger { align-self:center; width:min(72vw,300px); aspect-ratio:1; border-radius:50%; border:4px solid rgba(255,255,255,.85);
    background:radial-gradient(circle, #ff4033 0%, #8c0000 100%); color:#fff; font:900 30px var(--font);
    box-shadow:0 0 14px rgba(255,0,0,.4); transition:transform .12s cubic-bezier(.3,1.6,.5,1), box-shadow .12s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; flex:none; }
  #trigger.down { transform:scale(.93); box-shadow:0 0 30px rgba(255,0,0,.9); }
  #trigger .icon { font-size:44px; line-height:1; }
  #diag { font:11px ui-monospace,Menlo,monospace; color:#555; text-align:center; min-height:14px; }
  #gate { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:30px; text-align:center; z-index:10; }
  #gate h1 { margin:0; font-size:30px; }
  #gate p { margin:0; color:#aaa; line-height:1.6; font-size:15px; }
  #gate button { border:0; border-radius:50%; width:180px; height:180px; font:900 28px var(--font); color:#fff;
    background:radial-gradient(circle, #ff4033 0%, #8c0000 100%); box-shadow:0 0 30px rgba(255,0,0,.6); }
  #gate .err { color:#ff6b5e; }
  #haptic { position:absolute; left:-9999px; opacity:0; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="app">
  <header>
    <div id="dot"></div><div id="status">未连接</div>
    <div id="kills">⌖ 0</div><div id="ammo">15/15</div>
  </header>
  <div class="seg" id="weapons">
    <button data-w="pistol" class="sel">手枪</button><button data-w="rifle">步枪</button>
  </div>
  <div id="result">顶端对准屏幕按「回中」· 甩一下换弹</div>
  <div id="marker"><svg viewBox="0 0 120 120"><path id="markerPath" fill="none" stroke-linecap="round"/></svg></div>
  <div class="row"><button class="btn small" id="revive">♥ 全部复活</button></div>
  <div class="row">
    <button class="btn blue" id="recenter">◎ 回中</button>
    <button class="btn orange" id="reload">↻ 换弹</button>
  </div>
  <button id="trigger"><span class="icon">🔥</span>开火</button>
  <div id="diag"></div>
</div>
<div id="gate">
  <h1>手机扳机</h1>
  <p>手机顶端对准电脑屏幕<br>转动手机瞄准，按红色按钮开火</p>
  <button id="start">开始</button>
  <p id="gateMsg"></p>
  <p id="inApp" style="display:none" class="err">你现在在 App 内置浏览器里，可能很慢或拿不到陀螺仪。<br>建议点右上角「···」→「在 Safari 中打开」，<br>或直接用 iPhone 相机扫电脑菜单栏里的二维码。</p>
</div>
<label id="haptic"><input type="checkbox" switch id="hapticBox"></label>

<script>
"use strict";
const $ = id => document.getElementById(id);
const WEAPONS = {
  pistol: { title: "手枪", magazine: 15, auto: null },
  rifle:  { title: "步枪", magazine: 45, auto: 100 },
};
const session = Math.random().toString(36).slice(2, 8);
const st = { weapon: "pistol", ammo: 15, reloading: false, kills: 0, fireSeq: 0, autoTimer: null,
             lastShake: 0, aim: null, aimCount: 0, aimHz: 0, transport: "", connected: false };

// ---------- 连接：优先 WebSocket，打不开就退回 HTTP 轮询 ----------
let ws = null, pollOut = [], polling = false, wsEverOpened = false;

function connect() {
  setStatus("正在连接电脑…", false);
  try { ws = new WebSocket(`wss://${location.host}/ws`); } catch (e) { startPolling(); return; }
  const timer = setTimeout(() => { if (!wsEverOpened) { try { ws.close(); } catch {} startPolling(); } }, 2500);
  ws.onopen = () => { clearTimeout(timer); wsEverOpened = true; st.transport = "WebSocket"; setStatus("已连接电脑", true); send("R"); };
  ws.onmessage = e => handle(e.data);
  ws.onerror = () => {};
  ws.onclose = () => {
    clearTimeout(timer);
    if (!wsEverOpened) { startPolling(); return; }
    setStatus("连接断开，重连中…", false);
    setTimeout(connect, 1000);
  };
}

function startPolling() {
  if (polling) return;
  polling = true; ws = null; st.transport = "HTTP 轮询";
  pollOut.push("R");
  (async function loop() {
    while (true) {
      const lines = pollOut; pollOut = [];
      if (st.aim) lines.unshift(st.aim), st.aim = null;
      try {
        const r = await fetch("/msg", { method: "POST", body: lines.join("\n"), cache: "no-store" });
        const t = await r.text();
        setStatus("已连接电脑", true);
        if (t) t.split("\n").forEach(handle);
      } catch (e) {
        setStatus("连接断开，重连中…", false);
        await new Promise(r => setTimeout(r, 800));
      }
      await new Promise(r => setTimeout(r, 12));
    }
  })();
}

function send(line) {
  if (ws && ws.readyState === 1) ws.send(line);
  else if (polling) pollOut.push(line);
}
function sendAim(line) {
  if (ws && ws.readyState === 1) ws.send(line);
  else if (polling) st.aim = line;   // 轮询模式只保留最新朝向
}

function setStatus(text, ok) {
  st.connected = ok;
  $("status").textContent = text;
  $("dot").classList.toggle("ok", ok);
}
setInterval(() => send("P"), 1000);

// ---------- 陀螺仪：算手机“顶端”在世界坐标里的朝向 ----------
// W3C 规范：R = Rz(alpha)·Rx(beta)·Ry(gamma)，设备 y 轴（顶端）在世界坐标 = R 的第二列
// gamma 是绕 y 轴本身转，不影响顶端指向，所以横握竖握、手机歪不歪都一样。
const D = Math.PI / 180;
function onOrientation(e) {
  if (e.alpha == null || e.beta == null) return;
  const a = e.alpha * D, b = e.beta * D;
  const x = -Math.cos(b) * Math.sin(a), y = Math.cos(a) * Math.cos(b), z = Math.sin(b);
  const yaw = Math.atan2(y, x), pitch = Math.atan2(z, Math.hypot(x, y));
  st.aimCount++;
  if (performance.now() - st.lastShake < 500) return;   // 甩手换弹那一下别把准星甩飞
  sendAim(`A ${yaw.toFixed(5)} ${pitch.toFixed(5)}`);
}
function onMotion(e) {
  const a = e.acceleration;
  if (!a || a.x == null) return;
  const g = Math.hypot(a.x, a.y, a.z) / 9.81;
  const now = performance.now();
  if (g > 2.2 && now - st.lastShake > 900) { st.lastShake = now; reload(true); }
}
setInterval(() => { st.aimHz = st.aimCount; st.aimCount = 0; renderDiag(); }, 1000);

function renderDiag() {
  $("diag").textContent = `${st.transport || "-"} · 陀螺仪 ${st.aimHz}Hz · ${isSecureContext ? "HTTPS" : "非安全上下文"}`;
}

// ---------- 声音（Web Audio 合成，和 App 版同一路思路） ----------
let ctx = null; const buffers = {};
function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const sr = ctx.sampleRate;
  const make = (dur, fn) => {
    const b = ctx.createBuffer(1, Math.floor(sr * dur), sr), d = b.getChannelData(0);
    let lp = 0;
    for (let i = 0; i < d.length; i++) { const t = i / sr; lp = fn(t, lp); d[i] = lp; }
    return b;
  };
  // 枪声：低频冲击 + 衰减噪声（一阶低通让它不刺耳）
  const shot = (dur, thump, decay, cutoff) => {
    const k = 1 - Math.exp(-2 * Math.PI * cutoff / sr);
    let y = 0;
    return make(dur, t => {
      const n = (Math.random() * 2 - 1) * Math.exp(-t * decay);
      y += k * (n - y);
      const body = Math.sin(2 * Math.PI * thump * t * (1 - t * 2)) * Math.exp(-t * 28) * 0.9;
      return Math.max(-1, Math.min(1, (y * 2.2 + body + n * 0.25) * 0.8));
    });
  };
  buffers.pistol = shot(0.35, 95, 18, 3200);
  buffers.rifle = shot(0.22, 120, 26, 4200);
  buffers.empty = make(0.05, t => (Math.random() * 2 - 1) * Math.exp(-t * 160) * 0.5);
  buffers.hit = make(0.08, t => Math.sin(2 * Math.PI * 1800 * t) * Math.exp(-t * 50) * 0.35);
  fetch("/reload.wav").then(r => r.arrayBuffer()).then(a => ctx.decodeAudioData(a)).then(b => buffers.reload = b).catch(() => {});
}
function play(name, vol = 1) {
  if (!ctx || !buffers[name]) return;
  if (ctx.state !== "running") ctx.resume();
  const s = ctx.createBufferSource(), g = ctx.createGain();
  s.buffer = buffers[name]; g.gain.value = vol;
  s.connect(g).connect(ctx.destination); s.start();
}

// ---------- 震动 ----------
// 安卓用 navigator.vibrate；iOS Safari 没有震动 API，借 iOS 18 的 <input switch> 切换时自带的触感（只在手指操作里稳定生效）
function haptic(pattern) {
  if (navigator.vibrate) { navigator.vibrate(pattern); return; }
  const taps = Array.isArray(pattern) ? Math.ceil(pattern.length / 2) : 1;
  for (let i = 0; i < taps; i++) setTimeout(() => $("haptic").click(), i * 70);
}

// ---------- 枪 ----------
function weapon() { return WEAPONS[st.weapon]; }
function renderAmmo() {
  $("ammo").textContent = `${st.ammo}/${weapon().magazine}`;
  $("ammo").classList.toggle("empty", st.ammo === 0);
}
function setResult(t, cls = "") { const r = $("result"); r.textContent = t; r.className = cls; }

function fireOnce() {
  if (st.reloading) return;
  if (st.ammo <= 0) { haptic(15); play("empty"); triggerUp(); setResult("没子弹了，甩一下手机换弹"); return; }
  st.ammo--; renderAmmo();
  send(`F ${session}-${++st.fireSeq} ${st.weapon}`);
  haptic(st.weapon === "pistol" ? 30 : 18);
  play(st.weapon, 0.9);
  if (st.ammo === 0) triggerUp();
}
function triggerDown() {
  $("trigger").classList.add("down");
  fireOnce();
  const iv = weapon().auto;
  if (iv) { clearInterval(st.autoTimer); st.autoTimer = setInterval(fireOnce, iv); }
}
function triggerUp() {
  $("trigger").classList.remove("down");
  clearInterval(st.autoTimer); st.autoTimer = null;
}
function reload(byShake = false) {
  if (st.reloading) return;
  if (!byShake && st.ammo >= weapon().magazine) return;
  st.reloading = true; triggerUp();
  haptic([20, 260, 30, 140, 25]); play("reload");
  setResult("换弹中…"); $("reload").textContent = "↻ 换弹中";
  setTimeout(() => {
    st.ammo = weapon().magazine; st.reloading = false; renderAmmo();
    setResult("换弹完成"); $("reload").textContent = "↻ 换弹";
  }, 550);
}

let flashTimer = null;
function showHit(kind) {
  const color = kind === 2 ? "#ff4033" : kind === 1 ? "#ffd64d" : "#fff";
  const r = kind === 2 ? 46 : 34, c = 60;
  let d = "";
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
    d += `M${c + dx * r * .4} ${c + dy * r * .4}L${c + dx * r} ${c + dy * r}`;
  const p = $("markerPath");
  p.setAttribute("d", d); p.setAttribute("stroke", color); p.setAttribute("stroke-width", kind === 2 ? 7 : 5);
  const svg = $("marker").firstElementChild;
  svg.classList.add("on"); $("flash").classList.add("on");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { svg.classList.remove("on"); $("flash").classList.remove("on"); }, 120);
}

function handle(m) {
  const p = m.split(" ");
  switch (p[0]) {
    case "H": {
      const head = p[2] === "1";
      haptic(head ? [25, 50, 25] : 20); play("hit", 0.6);
      setResult(head ? `爆头！-${p[1]}` : `命中 -${p[1] || ""}`, head ? "head" : "");
      showHit(head ? 1 : 0); break;
    }
    case "K":
      haptic([30, 30, 300]); st.kills++;
      $("kills").textContent = `⌖ ${st.kills}`;
      setResult(`击杀 ${p.slice(1).join(" ")}`, "kill"); showHit(2); break;
    case "M": setResult("未命中"); break;
  }
}

// ---------- 事件绑定 ----------
const tr = $("trigger");
tr.addEventListener("touchstart", e => { e.preventDefault(); triggerDown(); }, { passive: false });
tr.addEventListener("touchend", e => { e.preventDefault(); triggerUp(); }, { passive: false });
tr.addEventListener("touchcancel", triggerUp);
tr.addEventListener("mousedown", triggerDown);
tr.addEventListener("mouseup", triggerUp);
$("recenter").onclick = () => { send("R"); haptic(10); setResult("已回中"); };
$("reload").onclick = () => reload(false);
$("revive").onclick = () => { send("V"); haptic([20, 260, 30]); setResult("全部复活"); };
document.querySelectorAll("#weapons button").forEach(b => b.onclick = () => {
  st.weapon = b.dataset.w; st.ammo = weapon().magazine; renderAmmo();
  document.querySelectorAll("#weapons button").forEach(x => x.classList.toggle("sel", x === b));
});
document.addEventListener("gesturestart", e => e.preventDefault());

if (/MicroMessenger|QQ\/|Weibo|DingTalk|Lark|Feishu|xhsdiscover|BiliApp|aweme/i.test(navigator.userAgent)) $("inApp").style.display = "block";

let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

$("start").onclick = async () => {
  const msg = $("gateMsg");
  if (!isSecureContext) { msg.innerHTML = '<span class="err">需要用 https:// 打开，否则拿不到陀螺仪</span>'; return; }
  try {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== "granted") throw new Error("denied");
    }
    if (typeof DeviceMotionEvent?.requestPermission === "function") {
      await DeviceMotionEvent.requestPermission().catch(() => {});
    }
  } catch (e) {
    msg.innerHTML = '<span class="err">没拿到「动作与方向」权限。<br>关掉这个网页重新打开，再点开始并选「允许」。</span>';
    return;
  }
  window.addEventListener("deviceorientation", onOrientation);
  window.addEventListener("devicemotion", onMotion);
  initAudio(); keepAwake();
  $("gate").style.display = "none";
  connect(); renderAmmo(); renderDiag();
  setTimeout(() => { if (st.aimHz === 0) setResult("没收到陀螺仪数据", "kill"); }, 2500);
};
</script>
</body>
</html>
